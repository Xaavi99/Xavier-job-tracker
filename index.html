<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xavier's Job Tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#1f2937;}
    .wrap{padding:1.5rem 1rem;max-width:1280px;margin:0 auto;}
    .top-bar{display:flex;align-items:center;gap:16px;margin-bottom:2rem;flex-wrap:wrap}
    .top-bar h2{font-size:26px;font-weight:700;color:#1f2937;flex:1}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:2rem}
    .stat{background:white;border-radius:16px;padding:1.25rem;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1)}
    .stat-label{font-size:13px;color:#6b7280;margin-bottom:8px}
    .stat-num{font-size:32px;font-weight:700;color:#1f2937}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem}
    .filter-btn{font-size:14px;padding:8px 18px;border:1px solid #e5e7eb;border-radius:9999px;background:white;color:#4b5563;cursor:pointer;transition:all .2s}
    .filter-btn.active{background:#2563eb;color:white;border-color:#2563eb}
    table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1)}
    thead th{text-align:left;padding:14px 20px;font-size:13px;font-weight:600;color:#6b7280;background:#f9fafb}
    tbody tr{border-bottom:1px solid #f1f5f9}
    tbody tr:hover{background:#f8fafc}
    td{padding:14px 20px;vertical-align:middle}
    td.wrap-text{white-space:normal;line-height:1.45}
    .tier{font-size:13px;font-weight:600;padding:5px 12px;border-radius:9999px}
    .tier-a{background:#e0e7ff;color:#4338ca}
    .tier-b{background:#dbeafe;color:#1e40af}
    .tier-c{background:#f3e8ff;color:#6b21a8}
    .status-pill{font-size:13.5px;padding:6px 14px;border-radius:9999px;cursor:pointer;font-weight:500}
    .s-interested{background:#fef3c7;color:#854d0e}
    .s-applied{background:#dcfce7;color:#166534}
    .s-interview{background:#a7f3d0;color:#0f766e}
    .s-offer{background:#e0e7ff;color:#4338ca}
    .s-declined{background:#fecaca;color:#b91c1c}
    .s-rejected{background:#f3e8ff;color:#6b21a8}
    .notes-input{width:100%;border:none;background:transparent;outline:none;font-size:14px;padding:4px 0}
    .add-row-btn{margin:1rem 0;padding:12px 24px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#1e2937;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
    .add-row-btn:hover{background:#f1f5f9}
    .del-btn{color:#94a3b8;font-size:20px;background:none;border:none;cursor:pointer;padding:4px}
    .del-btn:hover{color:#ef4444}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:1rem}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h2>🎯 Xavier Sojan — Job Tracker</h2>
    <button class="add-row-btn" onclick="addRow()">+ Add New Role</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total Roles</div><div class="stat-num" id="st-total">0</div></div>
    <div class="stat"><div class="stat-label">Applied</div><div class="stat-num" id="st-applied">0</div></div>
    <div class="stat"><div class="stat-label">Interviews</div><div class="stat-num" id="st-interview">0</div></div>
    <div class="stat"><div class="stat-label">Offers</div><div class="stat-num" id="st-offer">0</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterBy('all',this)">All</button>
    <button class="filter-btn" onclick="filterBy('A',this)">Tier A</button>
    <button class="filter-btn" onclick="filterBy('B',this)">Tier B</button>
    <button class="filter-btn" onclick="filterBy('C',this)">Tier C</button>
    <button class="filter-btn" onclick="filterBy('Applied',this)">Applied</button>
    <button class="filter-btn" onclick="filterBy('Interview',this)">Interview</button>
  </div>

  <table id="job-table">
    <thead>
      <tr>
        <th>Role / Company</th>
        <th>Location</th>
        <th>Tier</th>
        <th>Status</th>
        <th>Date Applied</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="actions">
    <button class="add-row-btn" onclick="addRow()">+ Add Role</button>
    <button class="add-row-btn" onclick="exportData()">📤 Export JSON</button>
    <button class="add-row-btn" onclick="importFromFile()">📥 Import JSON</button>
    <button class="add-row-btn" onclick="resetToInitial()" style="color:#2563eb">Reset to Initial Data</button>
  </div>
</div>

<script>
const STATUSES = ['Interested','Applied','Interview','Offer','Declined','Rejected'];
const STATUS_CLASS = {Interested:'s-interested',Applied:'s-applied',Interview:'s-interview',Offer:'s-offer',Declined:'s-declined',Rejected:'s-rejected'};

let jobs = [];
let currentFilter = 'all';

async function loadInitialData() {
  try {
    const res = await fetch('jobs.json');
    const initialJobs = await res.json();
    
    const saved = localStorage.getItem('xavierJobTracker');
    if (saved) {
      jobs = JSON.parse(saved);
    } else {
      jobs = initialJobs;
      localStorage.setItem('xavierJobTracker', JSON.stringify(jobs));
    }
  } catch(e) {
    console.error("Could not load jobs.json", e);
    jobs = [];
  }
  render();
}

function saveData() {
  localStorage.setItem('xavierJobTracker', JSON.stringify(jobs));
}

function render() {
  const filtered = jobs.filter(j => {
    if (currentFilter === 'all') return true;
    if (['A','B','C'].includes(currentFilter)) return j.tier === currentFilter;
    return j.status === currentFilter;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  filtered.forEach((job, fi) => {
    const realIdx = jobs.indexOf(job);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="wrap-text"><strong>${job.role}</strong><br><span style="color:#64748b;font-size:13px">${job.company}</span></td>
      <td>${job.location || ''}</td>
      <td><span class="tier tier-${job.tier.toLowerCase()}">${job.tier}</span></td>
      <td><span class="status-pill ${STATUS_CLASS[job.status]}" onclick="cycleStatus(${realIdx})">${job.status}</span></td>
      <td><input type="date" class="notes-input" value="${job.date || ''}" onchange="updateDate(${realIdx}, this.value)"></td>
      <td style="display:flex;gap:8px;align-items:center">
        <input class="notes-input" placeholder="Add notes..." value="${job.notes || ''}" onchange="updateNote(${realIdx}, this.value)">
        <button class="del-btn" onclick="deleteRow(${realIdx})">🗑</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('st-total').textContent = jobs.length;
  document.getElementById('st-applied').textContent = jobs.filter(j => j.status === 'Applied').length;
  document.getElementById('st-interview').textContent = jobs.filter(j => j.status === 'Interview').length;
  document.getElementById('st-offer').textContent = jobs.filter(j => j.status === 'Offer').length;
}

function cycleStatus(idx) {
  const i = STATUSES.indexOf(jobs[idx].status);
  jobs[idx].status = STATUSES[(i + 1) % STATUSES.length];
  saveData();
  render();
}

function updateNote(idx, val) {
  jobs[idx].notes = val;
  saveData();
}

function updateDate(idx, val) {
  jobs[idx].date = val;
  saveData();
}

function deleteRow(idx) {
  if (confirm("Delete this role?")) {
    jobs.splice(idx, 1);
    saveData();
    render();
  }
}

function addRow() {
  jobs.push({role:'New Role', company:'Company Name', location:'', tier:'B', status:'Interested', date:'', notes:''});
  saveData();
  render();
}

function filterBy(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function exportData() {
  const dataStr = JSON.stringify(jobs, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
  const link = document.createElement('a');
  link.href = dataUri;
  link.download = `jobs.json`;
  link.click();
}

function importFromFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        jobs = JSON.parse(ev.target.result);
        saveData();
        render();
        alert('✅ Imported!');
      } catch(err) {
        alert('❌ Invalid JSON');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetToInitial() {
  if (confirm("Reset to original data from jobs.json?")) {
    localStorage.removeItem('xavierJobTracker');
    location.reload();
  }
}

// Initialize
loadInitialData();
</script>
</body>
</html>
