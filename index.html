<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xavier — Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0e0e0f;--surface:#161618;--surface2:#1e1e21;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --text:#e8e8ea;--muted:#888890;
    --accent:#c8ff57;--accent-dim:rgba(200,255,87,0.12);--accent-text:#0e0e0f;
    --red:#ff5c5c;--amber:#ffb547;--blue:#5ca4ff;--teal:#4dd9ac;--purple:#b89dff;
    --radius:6px;--radius-lg:10px;
    --font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;min-height:100vh;padding:2rem}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
  .brand{display:flex;flex-direction:column;gap:4px}
  .brand-title{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase}
  h1{font-size:26px;font-weight:300;letter-spacing:-0.02em}
  h1 span{font-weight:500}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sync-status{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background 0.3s}
  .sync-dot.saving{background:var(--amber)}
  .sync-dot.saved{background:var(--teal)}
  .sync-dot.error{background:var(--red)}
  .btn{font-family:var(--font-body);font-size:13px;padding:7px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
  .btn:hover{background:var(--surface2);color:var(--text)}
  .btn-accent{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:500}
  .btn-accent:hover{background:#d4ff6a;color:var(--accent-text)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:2rem}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);margin-bottom:6px}
  .stat-num{font-size:28px;font-weight:300;letter-spacing:-0.03em}
  .stat-num.accent{color:var(--accent)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
  .filter-pill{font-family:var(--font-mono);font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;letter-spacing:0.05em}
  .filter-pill:hover{border-color:var(--border2);color:var(--text)}
  .filter-pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
  .search-input-wrap{position:relative}
  .search-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  #search{font-family:var(--font-body);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:6px 12px 6px 32px;width:200px;outline:none;transition:border-color 0.15s}
  #search:focus{border-color:var(--border2)}
  #search::placeholder{color:var(--muted)}
  #sort-select{font-family:var(--font-mono);font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:6px 10px;outline:none;cursor:pointer;transition:border-color 0.15s}
  #sort-select:focus,#sort-select:hover{border-color:var(--border2)}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;overflow-x:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:700px}
  thead th{text-align:left;padding:12px 14px;font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid var(--border)}
  col.c-role{width:20%}col.c-loc{width:12%}col.c-tier{width:7%}
  col.c-status{width:12%}col.c-date{width:12%}col.c-notes{width:20%}
  col.c-materials{width:8%}col.c-link{width:5%}col.c-del{width:4%}
  tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  td{padding:10px 14px;vertical-align:middle;font-size:13px}
  .role-name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .company-name{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tier-badge{font-family:var(--font-mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;display:inline-block}
  .tier-A{background:rgba(200,255,87,0.1);color:var(--accent);border:1px solid rgba(200,255,87,0.2)}
  .tier-B{background:rgba(92,164,255,0.1);color:var(--blue);border:1px solid rgba(92,164,255,0.2)}
  .tier-C{background:rgba(136,136,144,0.1);color:var(--muted);border:1px solid var(--border)}
  .status-pill{font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;display:inline-block;font-family:var(--font-mono);transition:opacity 0.1s;white-space:nowrap;user-select:none}
  .status-pill:hover{opacity:0.8}
  .s-Interested{background:rgba(255,181,71,0.1);color:var(--amber);border:1px solid rgba(255,181,71,0.2)}
  .s-Applied{background:rgba(77,217,172,0.1);color:var(--teal);border:1px solid rgba(77,217,172,0.2)}
  .s-Interview{background:rgba(184,157,255,0.1);color:var(--purple);border:1px solid rgba(184,157,255,0.2)}
  .s-Offer{background:rgba(200,255,87,0.12);color:var(--accent);border:1px solid rgba(200,255,87,0.25)}
  .s-Declined{background:rgba(255,92,92,0.08);color:var(--red);border:1px solid rgba(255,92,92,0.2)}
  .s-Rejected{background:rgba(136,136,144,0.1);color:var(--muted);border:1px solid var(--border)}
  .inline-input{background:transparent;border:none;color:var(--text);font-family:var(--font-body);font-size:12px;width:100%;outline:none;padding:0}
  .inline-input::placeholder{color:#3a3a3e}
  .inline-input[type="date"]{color-scheme:dark;color:var(--muted)}
  .link-btn{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;transition:color 0.15s}
  .link-btn:hover{color:var(--accent)}
  .del-btn{background:none;border:none;color:#3a3a3e;cursor:pointer;padding:4px;transition:color 0.15s;line-height:1;display:flex;align-items:center}
  .del-btn:hover{color:var(--red)}
  .tag-inline{font-family:var(--font-mono);font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;border:1px solid}
  .referral-tag{background:rgba(200,255,87,0.15);color:var(--accent);border-color:rgba(200,255,87,0.3)}
  .track-europe{background:rgba(92,164,255,0.15);color:var(--blue);border-color:rgba(92,164,255,0.3)}
  .track-phd{background:rgba(184,157,255,0.15);color:var(--purple);border-color:rgba(184,157,255,0.3)}
  .materials-tag{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:4px;background:rgba(92,164,255,0.1);color:var(--blue);border:1px solid rgba(92,164,255,0.2);white-space:nowrap;cursor:pointer;transition:opacity 0.15s}
  .materials-tag:hover{opacity:0.75}
  .materials-none{color:#3a3a3e;font-size:11px}
  .loading{text-align:center;padding:4rem;color:var(--muted);font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em}
  .loading-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:12px;font-family:var(--font-mono);color:var(--accent);opacity:0;transform:translateY(8px);transition:all 0.2s;pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.error-toast{color:var(--red);border-color:rgba(255,92,92,0.3)}
  .login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
  .login-card h2{font-size:16px;font-weight:500}
  .login-card label{font-size:11px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;display:block}
  .login-card input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);padding:8px 10px;font-family:var(--font-body);font-size:13px;outline:none}
  .login-card input:focus{border-color:var(--accent)}
  .login-error{font-size:11px;color:var(--red);font-family:var(--font-mono);min-height:14px}
  .hidden{display:none !important}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:300;padding:2rem}
  .modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:15px;font-weight:500}
  .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
  .modal-close:hover{color:var(--text)}
  .modal-ats{padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:baseline}
  .modal-ats .score{color:var(--blue);font-weight:500}
  .modal-tabs{display:flex;gap:6px;padding:0.75rem 1.25rem 0}
  .modal-tab{font-family:var(--font-mono);font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .modal-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .modal-body{padding:1.25rem;overflow-y:auto;flex:1;white-space:pre-wrap;font-size:13px;line-height:1.6}
  .modal-actions{display:flex;gap:8px;padding:1rem 1.25rem;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="login-screen hidden" id="login-screen">
  <form class="login-card" id="login-form">
    <h2>Sign in</h2>
    <div>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="username">
    </div>
    <div>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <div class="login-error" id="login-error"></div>
    <button type="submit" class="btn btn-accent" style="justify-content:center">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">

<header>
  <div class="brand">
    <span class="brand-title">Xavier Sojan · Asset Integrity</span>
    <h1>Job <span>tracker</span></h1>
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-label">connected</span>
    </div>
    <button class="btn" onclick="exportCSV()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV
    </button>
    <button class="btn btn-accent" onclick="addRow()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add role
    </button>
    <button class="btn" onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-label">Total</div><div class="stat-num" id="st-total">—</div></div>
  <div class="stat"><div class="stat-label">Applied</div><div class="stat-num accent" id="st-applied">—</div></div>
  <div class="stat"><div class="stat-label">Interviews</div><div class="stat-num" id="st-interview">—</div></div>
  <div class="stat"><div class="stat-label">Offers</div><div class="stat-num" id="st-offer">—</div></div>
  <div class="stat"><div class="stat-label">Tier A</div><div class="stat-num" id="st-tierA">—</div></div>
  <div class="stat"><div class="stat-label">Tier B</div><div class="stat-num" id="st-tierB">—</div></div>
</div>

<div class="controls">
  <button class="filter-pill track-pill active" onclick="setTrack('all',this)">All tracks</button>
  <button class="filter-pill track-pill" onclick="setTrack('industry',this)">Industry</button>
  <button class="filter-pill track-pill" onclick="setTrack('europe',this)">Europe</button>
  <button class="filter-pill track-pill" onclick="setTrack('phd',this)">PhD</button>
</div>

<div class="controls">
  <button class="filter-pill materials-pill active" onclick="setMaterials('all',this)">All materials</button>
  <button class="filter-pill materials-pill" onclick="setMaterials('tracked',this)">ATS tracked</button>
  <button class="filter-pill materials-pill" onclick="setMaterials('untracked',this)">Not built</button>
</div>

<div class="controls">
  <button class="filter-pill active" onclick="setFilter('all',this)">All</button>
  <button class="filter-pill" onclick="setFilter('A',this)">Tier A</button>
  <button class="filter-pill" onclick="setFilter('B',this)">Tier B</button>
  <button class="filter-pill" onclick="setFilter('C',this)">Tier C</button>
  <button class="filter-pill" onclick="setFilter('Applied',this)">Applied</button>
  <button class="filter-pill" onclick="setFilter('Interview',this)">Interview</button>
  <button class="filter-pill" onclick="setFilter('Offer',this)">Offers</button>
  <div class="search-wrap">
    <select id="sort-select" onchange="render()">
      <option value="default">Sort: Default</option>
      <option value="newest">Sort: Newest added</option>
      <option value="oldest">Sort: Oldest added</option>
      <option value="date-desc">Sort: Date applied (latest)</option>
      <option value="ats-desc">Sort: ATS score (highest)</option>
      <option value="ats-asc">Sort: ATS score (lowest)</option>
    </select>
    <div class="search-input-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search roles…" oninput="render()">
    </div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <colgroup>
      <col class="c-role"><col class="c-loc"><col class="c-tier">
      <col class="c-status"><col class="c-date"><col class="c-notes"><col class="c-materials"><col class="c-link"><col class="c-del">
    </colgroup>
    <thead>
      <tr>
        <th>Role / Company</th><th>Location</th><th>Tier</th>
        <th>Status</th><th>Date applied</th><th>Notes</th><th>Materials</th><th>Link</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="100%"><div class="loading"><div class="loading-spinner"></div><br>Loading from Supabase…</div></td></tr>
    </tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="materials-modal" onclick="if(event.target===this)closeMaterials()">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modal-title">Materials</h2>
      <button class="modal-close" onclick="closeMaterials()">&times;</button>
    </div>
    <div class="modal-ats" id="modal-ats"></div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tab-cv" onclick="showMaterialsTab('cv')">CV</button>
      <button class="modal-tab" id="tab-cl" onclick="showMaterialsTab('cl')">Cover letter</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-accent" onclick="downloadCurrentTab('docx')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download .docx
      </button>
      <button class="btn" onclick="downloadCurrentTab('pdf')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download .pdf
      </button>
      <button class="btn" onclick="copyCurrentTab()">Copy text</button>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js"></script>

// ── AUTH ──────────────────────────────────────────────────────────────────────
const SESSION_KEY = 'xjt_session';

function getSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e) { return null; }
}
function setSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

function authHeaders() {
  const s = getSession();
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + (s && s.access_token ? s.access_token : SB_KEY),
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal'
  };
}

async function authRequest(grantType, body) {
  const res = await fetch(SB_URL + '/auth/v1/token?grant_type=' + grantType, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Auth failed');
  return data;
}

async function refreshSession() {
  const s = getSession();
  if (!s || !s.refresh_token) return false;
  try {
    const data = await authRequest('refresh_token', { refresh_token: s.refresh_token });
    setSession({ access_token: data.access_token, refresh_token: data.refresh_token, expires_at: Date.now() + (data.expires_in * 1000) });
    return true;
  } catch(e) {
    clearSession();
    return false;
  }
}

async function trySession() {
  const s = getSession();
  if (!s) return false;
  if (s.expires_at && Date.now() < s.expires_at - 30000) return true;
  return await refreshSession();
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  dot.className = 'sync-dot ' + state;
  label.textContent = state === 'saving' ? 'saving…' : state === 'saved' ? 'saved' : state === 'error' ? 'error' : 'connected';
  if (state === 'saved') setTimeout(() => setSyncStatus(''), 2000);
}

async function sbFetch(path, options = {}, retried = false) {
  const res = await fetch(SB_URL + '/rest/v1/' + path, { ...options, headers: { ...authHeaders(), ...(options.headers||{}) } });
  if (res.status === 401) {
    const refreshed = !retried && await refreshSession();
    if (refreshed) return sbFetch(path, options, true);
    clearSession();
    showLogin();
    throw new Error('Session expired');
  }
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── MARKDOWN → STRUCTURED DOCUMENT (ATS-safe: real text, single column, no tables/images) ──
function parseMarkdownBlocks(md) {
  const lines = (md || '').replace(/\r\n/g, '\n').split('\n');
  const blocks = [];
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim() === '') { blocks.push({ type: 'blank' }); continue; }
    if (line.startsWith('# ')) { blocks.push({ type: 'h1', text: line.slice(2).trim() }); continue; }
    if (line.startsWith('## ')) { blocks.push({ type: 'h2', text: line.slice(3).trim() }); continue; }
    if (line.startsWith('- ') || line.startsWith('* ')) { blocks.push({ type: 'bullet', text: line.slice(2).trim() }); continue; }
    blocks.push({ type: 'para', text: line.trim() });
  }
  return blocks;
}

function parseInlineBold(text) {
  const parts = [];
  const re = /\*\*(.+?)\*\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ text: text.slice(last, m.index), bold: false });
    parts.push({ text: m[1], bold: true });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ text: text.slice(last), bold: false });
  if (parts.length === 0) parts.push({ text, bold: false });
  return parts;
}

const DOCX_NAVY = '1F3864';
const DOCX_GRAY = '595959';
const DOCX_RULE_COLOR = 'BFBFBF';

// CV shape: h1 (name) + a few identity lines (title/contact) before the first
// ## section, then ## sections of bullets/entries. The identity block is
// centered and set apart from the body with a rule.
function buildCvDocxChildren(blocks, docxLib) {
  const { Paragraph, TextRun, AlignmentType, BorderStyle } = docxLib;
  const RULE = { style: BorderStyle.SINGLE, size: 4, color: DOCX_RULE_COLOR, space: 2 };

  const firstH2 = blocks.findIndex(b => b.type === 'h2');
  const headerEnd = firstH2 === -1 ? blocks.length : firstH2;
  let lastHeaderLineIdx = -1;
  for (let k = 0; k < headerEnd; k++) {
    if (blocks[k].type !== 'blank' && blocks[k].type !== 'h1') lastHeaderLineIdx = k;
  }

  const children = [];
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.type === 'blank') continue;

    if (b.type === 'h1') {
      children.push(new Paragraph({
        children: [new TextRun({ text: b.text, bold: true, size: 32, color: DOCX_NAVY })],
        alignment: AlignmentType.CENTER,
        spacing: { after: 60 }
      }));
      continue;
    }

    if (b.type === 'h2') {
      children.push(new Paragraph({
        children: [new TextRun({ text: b.text.toUpperCase(), bold: true, size: 22, color: DOCX_NAVY })],
        border: { bottom: RULE },
        spacing: { before: 240, after: 100 }
      }));
      continue;
    }

    const isHeaderLine = i < headerEnd;
    const runs = parseInlineBold(b.text).map(p => new TextRun({
      text: p.text,
      bold: p.bold,
      size: isHeaderLine ? 20 : undefined,
      color: isHeaderLine ? DOCX_GRAY : undefined
    }));

    if (b.type === 'bullet') {
      children.push(new Paragraph({
        children: runs,
        bullet: { level: 0 },
        indent: { left: 360, hanging: 270 },
        spacing: { after: 40 }
      }));
      continue;
    }

    if (isHeaderLine) {
      const isLastHeaderLine = i === lastHeaderLineIdx;
      children.push(new Paragraph({
        children: runs,
        alignment: AlignmentType.CENTER,
        spacing: { after: isLastHeaderLine ? 200 : 40 },
        border: isLastHeaderLine ? { bottom: RULE } : undefined
      }));
      continue;
    }

    // A body paragraph that opens with a bold lead-in (job title / degree line)
    // sits tight above its own bullets/description; a plain paragraph gets normal
    // breathing room before the next block.
    const isEntry = b.text.startsWith('**');
    children.push(new Paragraph({
      children: runs,
      spacing: isEntry ? { before: 100, after: 20 } : { after: 120 }
    }));
  }
  return children;
}

// Letter shape: h1 (a title/label, not identity info) + prose paragraphs +
// a closing salutation ("Yours sincerely," / name) as the final two lines.
// No ## sections. Body paragraphs get normal letter spacing; the closing
// pair is held tight together instead of getting a full paragraph gap.
function buildLetterDocxChildren(blocks, docxLib) {
  const { Paragraph, TextRun, BorderStyle } = docxLib;
  const RULE = { style: BorderStyle.SINGLE, size: 4, color: DOCX_RULE_COLOR, space: 2 };

  const nonBlankIdx = [];
  blocks.forEach((b, i) => { if (b.type !== 'blank') nonBlankIdx.push(i); });
  const closingLines = new Set(nonBlankIdx.slice(-2));

  const children = [];
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.type === 'blank') continue;

    if (b.type === 'h1') {
      children.push(new Paragraph({
        children: [new TextRun({ text: b.text, bold: true, size: 26, color: DOCX_NAVY })],
        border: { bottom: RULE },
        spacing: { after: 200 }
      }));
      continue;
    }

    const runs = parseInlineBold(b.text).map(p => new TextRun({ text: p.text, bold: p.bold }));

    if (b.type === 'bullet') {
      children.push(new Paragraph({
        children: runs,
        bullet: { level: 0 },
        indent: { left: 360, hanging: 270 },
        spacing: { after: 60 }
      }));
      continue;
    }

    if (b.type === 'h2') {
      children.push(new Paragraph({ children: [new TextRun({ text: b.text, bold: true, size: 22 })], spacing: { before: 160, after: 80 } }));
      continue;
    }

    children.push(new Paragraph({
      children: runs,
      spacing: closingLines.has(i) ? { after: 20 } : { after: 180 }
    }));
  }
  return children;
}

async function buildDocxBlob(markdown, kind = 'cv') {
  const docxLib = docx;
  const { Document, Packer } = docxLib;
  const blocks = parseMarkdownBlocks(markdown);
  const children = kind === 'letter'
    ? buildLetterDocxChildren(blocks, docxLib)
    : buildCvDocxChildren(blocks, docxLib);

  const doc = new Document({
    sections: [{
      properties: { page: { margin: { top: 720, bottom: 720, left: 900, right: 900 } } },
      children
    }],
    styles: { default: { document: { run: { font: 'Calibri', size: 21 } } } }
  });
  return await Packer.toBlob(doc);
}

async function downloadDocx(filename, markdown, kind = 'cv') {
  const blob = await buildDocxBlob(markdown, kind);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function downloadPdf(filename, markdown) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const marginX = 50, maxWidth = 495, pageBottom = 792;
  let y = 56;
  const lineHeight = 14;

  function ensureSpace(extra) {
    if (y + extra > pageBottom) { doc.addPage(); y = 56; }
  }

  function renderRuns(runs, x, fontSize) {
    doc.setFontSize(fontSize);
    let cursorX = x;
    for (const r of runs) {
      doc.setFont('helvetica', r.bold ? 'bold' : 'normal');
      const words = r.text.split(/(\s+)/);
      for (const w of words) {
        if (w === '') continue;
        const wWidth = doc.getTextWidth(w);
        if (cursorX + wWidth > marginX + maxWidth && w.trim() !== '') {
          y += lineHeight; ensureSpace(lineHeight); cursorX = x;
        }
        if (w.trim() !== '' || cursorX > x) doc.text(w, cursorX, y);
        cursorX += wWidth;
      }
    }
    y += lineHeight;
  }

  const blocks = parseMarkdownBlocks(markdown);
  for (const b of blocks) {
    if (b.type === 'blank') { y += lineHeight * 0.4; continue; }
    if (b.type === 'h1') {
      ensureSpace(lineHeight * 1.6);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
      doc.text(b.text, marginX, y); y += lineHeight * 1.7;
      continue;
    }
    if (b.type === 'h2') {
      y += lineHeight * 0.4;
      ensureSpace(lineHeight * 1.4);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
      doc.text(b.text, marginX, y); y += lineHeight * 1.4;
      continue;
    }
    ensureSpace(lineHeight);
    const runs = parseInlineBold(b.text);
    if (b.type === 'bullet') {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
      doc.text('•', marginX, y);
      renderRuns(runs, marginX + 14, 10.5);
    } else {
      renderRuns(runs, marginX, 10.5);
    }
  }
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function downloadCurrentTab(format) {
  if (!modalState) return;
  const { job, app, tab } = modalState;
  const slug = slugify(job.company) + '-' + slugify(job.role);
  const label = tab === 'cv' ? 'cv' : (job.track === 'phd' ? 'personal-statement' : 'cover-letter');

  if (format === 'pdf') {

    showToast('Downloaded PDF');
  } else {
    downloadDocx(slug + '-' + label + '.docx', text, tab === 'cv' ? 'cv' : 'letter')
      .then(() => showToast('Downloaded Word document'))
      .catch(() => showToast('Download failed — try the PDF option', true));
  }
}

async function copyCurrentTab() {
  if (!modalState) return;
  const text = modalState.tab === 'cv' ? modalState.app.cv_content : modalState.app.cover_letter_content;
  try {
    await navigator.clipboard.writeText(text || '');
    showToast('Copied to clipboard');
  } catch(e) {
    showToast('Copy failed — select and copy manually', true);
  }
}

function exportCSV() {
  const headers = ['Role','Company','Location','Tier','Status','Date Applied','Notes','Link'];
  const rows = jobs.map(j => [j.role,j.company,j.location,j.tier,j.status,j.date||'',j.notes||'',j.link||''].map(v => '"' + (v||'').replace(/"/g,'""') + '"'));
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'xavier-job-tracker.csv';
  a.click();
  showToast('CSV exported');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const query = document.getElementById('search').value.toLowerCase();
  const filtered = jobs.filter(j => {
    const tierMatch = ['all','A','B','C'].includes(currentFilter)
      ? (currentFilter === 'all' || j.tier === currentFilter)
      : j.status === currentFilter;
    const trackMatch = currentTrack === 'all' || (j.track || 'industry') === currentTrack;
    const hasMaterials = !!applicationsMap[j.id];
    const materialsMatch = currentMaterials === 'all'
      || (currentMaterials === 'tracked' && hasMaterials)
      || (currentMaterials === 'untracked' && !hasMaterials);
    const searchMatch = !query || (j.role+j.company+j.location+(j.notes||'')).toLowerCase().includes(query);
    return tierMatch && trackMatch && materialsMatch && searchMatch;
  });

  const sortMode = document.getElementById('sort-select')?.value || 'default';
  if (sortMode === 'newest') filtered.sort((a, b) => b.id - a.id);
  else if (sortMode === 'oldest') filtered.sort((a, b) => a.id - b.id);
  else if (sortMode === 'date-desc') filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  else if (sortMode === 'ats-desc' || sortMode === 'ats-asc') {
    const dir = sortMode === 'ats-desc' ? -1 : 1;
    filtered.sort((a, b) => {
      const av = applicationsMap[a.id]?.ats_score, bv = applicationsMap[b.id]?.ats_score;
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * dir;
    });
  }

  const tb = document.getElementById('tbody');
  tb.innerHTML = filtered.length === 0
    ? '<tr><td colspan="100%"><div class="loading">no roles match this filter</div></td></tr>'
    : filtered.map(j => `
      <tr>
        <td>
          <div class="role-name">${esc(j.role)}${j.referral ? '<span class="tag-inline referral-tag">REFERRAL</span>' : ''}</div>
          <div class="company-name">${esc(j.company)}${TRACK_BADGE[j.track] ? `<span class="tag-inline track-${j.track}">${TRACK_BADGE[j.track]}</span>` : ''}</div>
        </td>
        <td style="color:var(--muted);font-size:12px">${esc(j.location)}</td>
        <td><span class="tier-badge tier-${j.tier}">${j.tier}</span></td>
        <td><span class="status-pill s-${j.status}" onclick="cycleStatus(${j.id})" title="Click to cycle">${j.status}</span></td>
        <td><input type="date" class="inline-input" value="${esc(j.date||'')}" onchange="updateFieldLocal(${j.id},'date',this.value)"></td>
        <td><input type="text" class="inline-input" value="${esc(j.notes||'')}" placeholder="Add notes…" oninput="updateFieldLocal(${j.id},'notes',this.value)"></td>
        <td>${applicationsMap[j.id] ? `<span class="materials-tag" onclick="openMaterials(${j.id})" title="View / download">${applicationsMap[j.id].ats_score != null ? 'ATS ' + applicationsMap[j.id].ats_score : 'Ready'}</span>` : '<span class="materials-none">—</span>'}</td>
        <td>${j.link && /^https?:\/\//i.test(j.link) ? `<a href="${esc(j.link)}" target="_blank" rel="noopener" class="link-btn" title="Careers page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>` : ''}</td>
        <td><button class="del-btn" onclick="deleteRow(${j.id})" title="Remove">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button></td>
      </tr>`).join('');

  document.getElementById('st-total').textContent    = jobs.length;
  document.getElementById('st-applied').textContent  = jobs.filter(j => j.status === 'Applied').length;
  document.getElementById('st-interview').textContent= jobs.filter(j => j.status === 'Interview').length;
  document.getElementById('st-offer').textContent    = jobs.filter(j => j.status === 'Offer').length;
  document.getElementById('st-tierA').textContent    = jobs.filter(j => j.tier === 'A').length;
  document.getElementById('st-tierB').textContent    = jobs.filter(j => j.tier === 'B').length;
}

function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error-toast' : '') + ' show';
  setTimeout(() => el.className = 'toast', 2000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(async function init() {
  const ok = await trySession();
  if (ok) { showApp(); loadJobs(); }
  else { showLogin(); }
})();
</script>
</body>
</html>
